name: app-build-action
#推送Tag时触发
on:
  push:
    tags:
      - "v*"
jobs:
  build-mac-ios-android:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      #签出代码
      - uses: actions/checkout@v4
        with:
          ref: dev

      #APK签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > stitchtv_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> stitchtv_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> stitchtv_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> stitchtv_app/android/key.properties

      #设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd stitchtv_app
          flutter pub get

      # 安装appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      #获取版本信息（自动从 Git Tag 提取）
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      #打包APK
      - name: Build APK
        run: |
          cd stitchtv_app
          flutter build apk --release --split-per-abi

      # 重命名 APK
      - name: Rename APK
        run: |
          mv stitchtv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk stitchtv_app/build/app/outputs/flutter-apk/stitchtv_android_${{ steps.version.outputs.VERSION }}_armeabi-v7a.apk
          mv stitchtv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk stitchtv_app/build/app/outputs/flutter-apk/stitchtv_android_${{ steps.version.outputs.VERSION }}_arm64-v8a.apk
          mv stitchtv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk stitchtv_app/build/app/outputs/flutter-apk/stitchtv_android_${{ steps.version.outputs.VERSION }}_x86_64.apk

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            stitchtv_app/build/app/outputs/flutter-apk/*.apk

      #打包iOS
      - name: Build IPA
        run: |
          cd stitchtv_app
          flutter build ios --release --no-codesign

      #创建未签名ipa
      - name: Create IPA
        run: |
          cd stitchtv_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r stitchtv_ios_nosign_${{ steps.version.outputs.VERSION }}.ipa Payload
          cd ../../..

      #上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            stitchtv_app/build/ios/iphoneos/*.ipa

      # 打包MAC
      - name: Build MacOS
        run: |
          cd stitchtv_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 重命名 MacOS 产物
      - name: Rename MacOS
        run: |
          mv stitchtv_app/build/dist/*/*.dmg stitchtv_app/build/dist/stitchtv_macos_${{ steps.version.outputs.VERSION }}.dmg
          mv stitchtv_app/build/dist/*/*.zip stitchtv_app/build/dist/stitchtv_macos_${{ steps.version.outputs.VERSION }}.zip

      # 上传MAC至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            stitchtv_app/build/dist/*.dmg
            stitchtv_app/build/dist/*.zip


      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            stitchtv_app/build/app/outputs/flutter-apk/*.apk
            stitchtv_app/build/ios/iphoneos/*.ipa
            stitchtv_app/build/dist/stitchtv_macos_${{ steps.version.outputs.VERSION }}.*
      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
